############################################################
#                                                          #
#              Rede vIRCio - inspircd.conf                 #
#                                                          #
#     CONFIGURACAO PADRAO E IMUTAVEL DA REDE vIRCio       #
#                                                          #
# Nao altere este arquivo individualmente em um IRCd.      #
# Configuracoes especificas devem ficar em ircd.conf.      #
#                                                          #
############################################################


# ==========================================================
# Variaveis globais da Rede vIRCio
# ==========================================================

<define name="networkName" value="vIRCio">
<define name="networkDomain" value="vircio.net">
<define name="networkEmail" value="contato@vircio.net">
<define name="networkDescription" value="vIRCio - conectando pessoas">

<define name="inspircdVersion" value="4.12.0">

<define name="clientPort" value="6667">
<define name="clientTLSPort" value="6697">
<define name="serverTLSPort" value="7007">
<define name="websocketPort" value="7002">


# ==========================================================
# Configuracao especifica deste IRCd
# ==========================================================

<include file="ircd.conf">


# ==========================================================
# Informacoes administrativas
# ==========================================================

<admin
    name="vIRCio.net"
    description="Rede vIRCio"
    email="&networkEmail;">


# ==========================================================
# Classes de conexao
# ==========================================================

#
# Usuarios locais e bots da rede
#

<connect
    name="localhost"
    parent="users"
    allow="127.0.0.0/8"
    maxchans="5000"
    localmax="1000"
    globalmax="1000"
    useconnectban="no"
    useconnflood="no"
    usednsbl="no"
    useident="no"
    usests="no"
    modes="+Bx">

<connect
    name="localhost6"
    parent="users"
    allow="::1"
    maxchans="5000"
    localmax="1000"
    globalmax="1000"
    useconnectban="no"
    useconnflood="no"
    usednsbl="no"
    useident="no"
    usests="no"
    modes="+Bx">


#
# WebChat interno - KiwiIRC
#
# O cliente precisa autenticar por SASL antes de completar
# o registro na rede.
#

<connect
    name="webchat-before-reg"
    parent="users"
    allow="*"
    registered="no"
    webirc="KiwiIRC"
    localmax="100"
    globalmax="100"
    useconnectban="no"
    useconnflood="no"
    usednsbl="no">

<connect
    name="webchat"
    parent="users"
    allow="*"
    registered="yes"
    webirc="KiwiIRC"
    requireaccount="yes"
    localmax="100"
    globalmax="100"
    useconnectban="yes"
    useconnflood="yes"
    usednsbl="yes">

<connect
    deny="*"
    registered="yes"
    webirc="KiwiIRC"
    requireaccount="no"
    reason="Este WebChat exige autenticacao SASL. Registre e identifique seu nick para conectar.">


#
# WebIRC externos
#
# Os gateways autorizados serao definidos no vIRCio.modules.
#

<connect
    name="webircs"
    parent="users"
    allow="*"
    webirc="*"
    localmax="100"
    globalmax="100"
    useconnectban="yes"
    useconnflood="yes"
    usednsbl="yes">


#
# IRCCloud
#
# Utiliza a configuracao atual fornecida pelo InspIRCd v4.
#

# IRCCloud
#
# Baseado na configuracao oficial do InspIRCd v4.
# Adaptado para herdar da classe padrao da vIRCio: users.

<connect
    name="IRCCloud"
    parent="users"
    globalmax="100"
    localmax="100"
    useconnectban="no"
    useconnflood="no"
    usednsbl="no">

<connect
    name="IRCCloud (IPv4)"
    parent="IRCCloud"
    allow="5.254.36.56/29 5.254.36.104/29"
    uniqueusername="yes">

<connect
    name="IRCCloud (IPv6)"
    parent="IRCCloud"
    allow="2a03:5180:f::/62 2a03:5180:f:4::/63 2a03:5180:f:6::/64"
    uniqueusername="yes">


#
# Usuarios normais
#

<connect
    name="users"
    allow="*"

    maxchans="30"

    timeout="45"
    pingfreq="2m"

    hardsendq="5M"
    softsendq="10240"
    recvq="10K"

    threshold="10"
    commandrate="1000"
    fakelag="yes"

    localmax="5"
    globalmax="10"

    useident="no"
    useconnectban="yes"
    useconnflood="yes"
    usednsbl="yes"
    usests="yes"

    limit="10000"

    modes="+x"

    resolvehostnames="no"

    requiressl="no">


# ==========================================================
# Clone CIDR
# ==========================================================

<cidr
    ipv4clone="32"
    ipv6clone="64">


# ==========================================================
# IRC Operators
# ==========================================================

# ATIVAR quando criarmos o arquivo definitivo.
<include file="vIRCio.roots" missingokay="yes">


# ==========================================================
# Services / Anope
# ==========================================================

# ATIVAR quando criarmos a integracao definitiva.
<include file="vIRCio.services" missingokay="yes">


# ==========================================================
# MOTD
# ==========================================================

# MOTD padrao da Rede vIRCio.
<files motd="vIRCio.motd">


# ==========================================================
# DNS
# ==========================================================

<dns timeout="5s">


# ==========================================================
# PID
# ==========================================================

# Arquivo relativo ao runtime/data directory.
<pid file="vIRCio.pid">


# ==========================================================
# Limites de listas
# ==========================================================

<maxlist
    chan="*"
    limit="128">


# ==========================================================
# Opcoes
# ==========================================================

<options
    prefixquit="Quit vIRCio.net: "
    suffixquit=""

    prefixpart="&quot;"
    suffixpart="&quot;"

    #fixedquit=""
    #fixedpart=""

    syntaxhints="yes"

    cyclehostsfromuser="no"

    announcets="no"
    allowmismatch="no"

    defaultbind="auto"

    maskinlist="yes"
    maskintopic="no"

    pingwarning="15"
    serverpingfreq="1m"

    splitwhois="no"

    defaultmodes="not"

    xlinemessage="You're banned! Voce esta' banido! Email contato@vIRCio.net"
    xlinequit="%fulltype%: %reason%"

    modesinlist="opers"

    extbanformat="name"

    exemptchanops="filter:o nickflood:o regmoderated:o nonick:v"

    invitebypassmodes="yes"

    nosnoticestack="no">


# ==========================================================
# Performance
# ==========================================================

<performance
    netbuffersize="10240"
    somaxconn="128"
    softlimit="12800"
    clonesonconnect="yes"
    timeskipwarn="2s"
    quietbursts="yes">


# ==========================================================
# Seguranca
# ==========================================================

<security
    announceinvites="dynamic"

    hideservices="yes"
    flatlinks="yes"

    hideserver="irc.vircio.net"

    publicxlinequit="%fulltype%"

    hidekills=""
    hideservicekills="no"

    hidesplits="yes"

    maxtargets="20"

    customversion="vIRCio-InspIRCd-&inspircdVersion;"

    # O daemon ja executa diretamente como usuario/grupo vircio.
    #runasuser="vircio"
    #runasgroup="vircio"

    restrictbannedusers="yes"

    genericoper="no"

    userstats="Pu">


# ==========================================================
# Limites
# ==========================================================

<limits
    maxaway="200"
    maxchan="64"
    maxhost="64"
    maxuser="11"
    maxkey="30"
    maxkick="300"
    maxmodes="20"
    maxnick="31"
    maxquit="300"
    maxreal="130"
    maxtopic="500">


# ==========================================================
# Logs
# ==========================================================

<log
    method="file"
    level="normal"
    type="* -USERINPUT -USEROUTPUT"
    target="inspircd.log">

<log
    method="file"
    level="normal"
    type="OPER"
    target="opers.log">

<log
    method="file"
    level="normal"
    type="KILL"
    target="kill.log">


# ==========================================================
# WHOWAS
# ==========================================================

<whowas
    groupsize="15"
    maxgroups="10000"
    maxkeep="7d"
    nickupdate="yes">


# ==========================================================
# Insane bans
# ==========================================================

# Nao utilizado atualmente.
# Mantido para ativacao futura se necessario.

#<insane
#    hostmasks="no"
#    ipmasks="no"
#    nickmasks="no"
#    trigger="95.5">


# ==========================================================
# Modulos padrao da Rede vIRCio
# ==========================================================

<include file="vIRCio.modules">


# ==========================================================
# Quotes
# ==========================================================
#
# vIRCio.quotes nao utilizado.
# O recurso de random quotes permanece desativado.
#
